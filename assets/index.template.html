<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Background","default":"#fdfae7"},
    {"id":"color-ink","type":"color","label":"Text","default":"#111111"},
    {"id":"color-muted","type":"color","label":"Muted text","default":"#6b6b6b"},
    {"id":"color-light","type":"color","label":"Light text","default":"#9a9a9a"},
    {"id":"color-accent","type":"color","label":"Accent","default":"#1e2bfa"},
    {"id":"font-display","type":"string","label":"Display font","default":"Space Grotesk"},
    {"id":"font-body","type":"string","label":"Body font","default":"Inter"}%FACT_VARS%
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      // Generated by build_index.py from audio_meta.json and facts.json. Per scene (scene-local seconds):
      // __WORDS = [[word text, start]], __VO = the starts alone, __DUR = the slot length. __FACTS = facts.json.
      window.__WORDS = %WORDS%;
      window.__VO = %VO%;
      window.__DUR = %DUR%;
      window.__FACTS = %FACTS%;
      // Shared, seek-safe moves (fromTo only). Scenes call these with word-cued times.
      window.fx = {
        // No CSS filters anywhere: a filter drops the renderer from fast capture to screenshot capture (about 2x slower).
        // The name stays "blur" so older scenes keep working; it is a fade with a small rise.
        blur(tl, sel, t, d = 0.2) { tl.fromTo(sel, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: d, ease: "power4.out" }, t); },
        rise(tl, sel, t, o = {}) { tl.fromTo(sel, { opacity: 0, y: o.y ?? 28 }, { opacity: 1, y: 0, duration: o.d ?? 0.6, ease: "expo.out", stagger: o.s ?? 0 }, t); },
        slide(tl, sel, t, o = {}) { tl.fromTo(sel, { opacity: 0, x: o.x ?? -48 }, { opacity: 1, x: 0, duration: o.d ?? 0.6, ease: "expo.out", stagger: o.s ?? 0 }, t); },
        pop(tl, sel, t, o = {}) { tl.fromTo(sel, { opacity: 0, scale: o.from ?? 0.8 }, { opacity: 1, scale: 1, duration: o.d ?? 0.5, ease: "back.out(1.4)", stagger: o.s ?? 0 }, t); },
        fade(tl, sel, t, o = {}) { tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: o.d ?? 0.4, ease: "power2.out", stagger: o.s ?? 0 }, t); },
        grow(tl, sel, t, to = 1, o = {}) { tl.fromTo(sel, { scaleX: 0 }, { scaleX: to, duration: o.d ?? 1.0, ease: o.ease ?? "power2.inOut", stagger: o.s ?? 0 }, t); },
        // Types an element's own text, one character per step. Each character is a span that fades in, so the result is a
        // function of timeline time. (A tween that rewrites textContent in onUpdate is not: callbacks do not fire on a
        // seek, so a frame captured by a direct jump shows no text and fast capture's self-check fails.)
        type(tl, sel, t, d) {
          const el = document.querySelector(sel), chars = [...el.textContent];
          el.textContent = "";
          const spans = chars.map((c) => { const s = document.createElement("span"); s.textContent = c; el.appendChild(s); return s; });
          tl.fromTo(spans, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", stagger: d / chars.length }, t);
        },
        // Swap out on one stage: content fades and lifts away, the cream ground never cuts.
        exit(tl, sel, D) { tl.to(sel, { opacity: 0, y: -12, duration: 0.25, ease: "power3.in" }, D - 0.32); },
        // Cue by word text: const at = fx.at(S); at("feed") is the start of the first "feed", at("draft", 2) of the second.
        // build_index.py checks every at() call against the voice words, so a missing word fails the build, not the render.
        at: (S) => (word, n = 1) => {
          const key = (x) => x.toLowerCase().replace(/[^a-z0-9]/g, "");
          let seen = 0;
          for (const [text, start] of window.__WORDS[S]) if (key(text) === key(word) && ++seen === n) return start;
          throw new Error(`at("${word}", ${n}): no such word in scene ${S}`);
        },
        // One owner per fact: facts.json (declared as composition variables, so --variables can override it).
        fact: (key) => ((window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {})[key]) ?? window.__FACTS[key],
      };
    </script>
    <style>
      @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/space-grotesk-500.woff2") format("woff2"); font-weight: 500; }
      @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/space-grotesk-600.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/space-grotesk-700.woff2") format("woff2"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--color-ground, #fdfae7); }
      #root { position: relative; width: 1920px; height: 1080px; background: var(--color-ground, #fdfae7); }

      /* Shared scene vocabulary (blue-professional, scaled for video). Every scene uses these. */
      .stage { position: absolute; inset: 0; font-family: var(--font-body), Inter, sans-serif; color: var(--color-ink, #111); }
      .eyebrow { position: absolute; left: 192px; top: 128px; font: 600 28px/1 var(--font-display), sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent, #1e2bfa); }
      .title { position: absolute; left: 192px; top: 178px; width: 1536px; font: 600 64px/1.1 var(--font-display), sans-serif; letter-spacing: -0.02em; color: var(--color-ink, #111); }
      .card { position: absolute; background: rgba(30, 43, 250, 0.04); border: 3px solid rgba(30, 43, 250, 0.2); border-radius: 14px; }
      .label { font: 500 32px/1.25 var(--font-body), Inter, sans-serif; color: var(--color-muted, #6b6b6b); }
      .label-ink { font: 600 34px/1.2 var(--font-display), sans-serif; color: var(--color-ink, #111); letter-spacing: -0.01em; }
      .mono, .term { font-family: "JetBrains Mono", monospace; font-variant-ligatures: none; }
      .num { font-family: var(--font-display), sans-serif; font-weight: 700; color: var(--color-accent, #1e2bfa); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
      .accent { color: var(--color-accent, #1e2bfa); }
      .src { position: absolute; left: 192px; top: 930px; font: 400 28px/1.2 var(--font-body), Inter, sans-serif; color: var(--color-muted, #6b6b6b); }
      .doc { position: absolute; width: 96px; height: 120px; border-radius: 10px; background: rgba(17, 17, 17, 0.07); border: 3px solid rgba(17, 17, 17, 0.12); }
      .doc::before, .doc::after { content: ""; position: absolute; left: 16px; right: 16px; height: 8px; border-radius: 4px; background: rgba(17, 17, 17, 0.16); }
      .doc::before { top: 24px; } .doc::after { top: 44px; right: 34px; }
      .doc.draft { background: rgba(30, 43, 250, 0.08); border: 3px dashed var(--color-accent, #1e2bfa); }
      .doc.draft::before, .doc.draft::after { background: rgba(30, 43, 250, 0.35); }
      .tag { position: absolute; font: 600 24px/1 var(--font-display), sans-serif; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-accent, #1e2bfa); }
      .term { position: absolute; background: #111111; border-radius: 14px; color: #fdfae7; font-family: "JetBrains Mono", monospace; }
      .bar-track { position: absolute; height: 60px; border-radius: 6px; background: rgba(30, 43, 250, 0.08); }
      .bar-fill { position: absolute; left: 0; top: 0; height: 60px; border-radius: 6px; background: var(--color-accent, #1e2bfa); transform-origin: 0 50%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="%TOTAL%" data-width="1920" data-height="1080">
%HOSTS%
%AUDIO%
      <div id="progress" data-composition-id="progress" data-composition-src="compositions/progress.html" data-start="0" data-duration="%TOTAL%" data-track-index="3" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
